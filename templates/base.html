{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChatApp">
  <title>{% block title %}ChatApp{% endblock %}</title>
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.svg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/base.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>{% block content %}{% endblock %}<button class="install-app-button" data-install-app hidden type="button"><i class="bi bi-download"></i> Instalar app</button>
<script src="{% static 'js/base.js' %}"></script>
{% block extra_js %}{% endblock %}
</body></html>
