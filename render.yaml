services:
  - type: web
    name: appchat
    env: python
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: appchat-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: REDIS_URL
        fromService:
          type: redis
          name: appchat-redis
          property: connectionString
  - type: redis
    name: appchat-redis
    plan: free
databases:
  - name: appchat-db
    plan: free
    databaseName: appchat
    user: appchat
